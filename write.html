<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · 비주얼매거진</title>
<style>
  :root{
    --gold:#ffcf8a;
    --amber:#e8823c;
    --bg-top:#0d0d0d;
    --bg-mid:#1a1a1a;
    --bg-bottom:#262626;
    --text:#f2f2f2;
    --text-muted:rgba(242,242,242,.6);
    --surface:rgba(255,255,255,.06);
    --surface-border:rgba(255,255,255,.14);
    --btn-bg:#f2f2f2;
    --btn-text:#0d0d0d;
  }
  :root[data-theme="light"]{
    --gold:#c97a2e;
    --amber:#b8571f;
    --bg-top:#ffffff;
    --bg-mid:#fafafa;
    --bg-bottom:#ededed;
    --text:#111111;
    --text-muted:rgba(17,17,17,.6);
    --surface:rgba(0,0,0,.05);
    --surface-border:rgba(0,0,0,.12);
    --btn-bg:#111111;
    --btn-text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 550px at 50% 0%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 70%),
      linear-gradient(180deg,var(--bg-top),var(--bg-mid) 45%,var(--bg-bottom) 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}

  nav{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    background:rgba(10,10,10,.4);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--surface-border);
  }
  .logo-lockup{display:flex;align-items:center;gap:8px;}
  .logo-mark{display:block;}
  .logo-name{
    font-size:15px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),var(--amber),var(--gold));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .navicons{display:flex;gap:10px;}
  .round{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);
  }

  main{padding:32px 0 80px;}
  .title-input{
    width:100%;border:none;background:transparent;color:var(--text);
    font-family:inherit;font-size:28px;font-weight:800;line-height:1.4;
    outline:none;margin-bottom:16px;
  }
  .title-input::placeholder{color:var(--text-muted);}

  .editor-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:860px){ .editor-grid{grid-template-columns:1fr 1fr;} }
  .pane-label{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;}
  textarea{
    width:100%;min-height:420px;resize:vertical;
    background:var(--surface);border:1px solid var(--surface-border);border-radius:14px;
    padding:16px;color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:14px;line-height:1.7;
    outline:none;
  }
  .preview{
    min-height:420px;background:var(--surface);border:1px solid var(--surface-border);border-radius:14px;
    padding:16px;overflow:auto;
  }
  .preview h1,.preview h2,.preview h3{margin:.8em 0 .4em;line-height:1.4;}
  .preview p{margin:.6em 0;line-height:1.8;font-size:15px;}
  .preview a{color:var(--amber);text-decoration:underline;}
  .preview ul,.preview ol{margin:.6em 0 .6em 1.2em;}
  .preview blockquote{border-left:3px solid var(--amber);padding-left:12px;color:var(--text-muted);margin:.6em 0;}
  .preview code{background:var(--surface-border);padding:2px 5px;border-radius:4px;font-size:13px;}
  .preview img{max-width:100%;border-radius:8px;}

  .toolbar{display:flex;gap:10px;margin:20px 0 48px;}
  button.action{
    padding:12px 22px;border-radius:999px;border:1px solid var(--surface-border);
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .save-btn{background:var(--btn-bg);color:var(--btn-text);border:none;}
  .clear-btn{background:transparent;color:var(--text);}

  .posts-title{font-size:17px;font-weight:800;margin-bottom:16px;}
  .post-list{list-style:none;}
  .post-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 0;border-bottom:1px solid var(--surface-border);
  }
  .post-row:first-child{padding-top:0;}
  .post-row h3{font-size:15px;font-weight:700;margin-bottom:4px;}
  .post-row .post-date{font-size:12px;color:var(--text-muted);}
  .post-actions{display:flex;gap:8px;flex:none;}
  .post-actions a,.post-actions button{
    font-size:13px;padding:6px 12px;border-radius:999px;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);cursor:pointer;font-family:inherit;
  }
  .empty{color:var(--text-muted);font-size:14px;}
  .notice{font-size:12px;color:var(--text-muted);margin-bottom:24px;line-height:1.6;}

  .auth-panel{max-width:360px;margin:0 0 40px;}
  .auth-panel input{
    width:100%;padding:12px 14px;border-radius:10px;
    background:var(--surface);border:1px solid var(--surface-border);
    color:var(--text);font-family:inherit;font-size:14px;margin-bottom:10px;outline:none;
  }
  .auth-row{display:flex;gap:8px;}
  .auth-row button{flex:1;}
  .auth-msg{font-size:12px;color:var(--amber);margin:-2px 0 10px;min-height:14px;}
  .auth-status{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;font-size:13px;color:var(--text-muted);
  }
  .auth-status button{
    font-size:13px;padding:6px 12px;border-radius:999px;font-family:inherit;cursor:pointer;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);
  }
  .hidden{display:none;}
</style>
</head>
<body>

<nav>
  <a class="logo-lockup" href="index.html">
    <svg class="logo-mark" viewBox="0 0 100 34" width="50" height="17" aria-label="VC">
      <text y="27" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="var(--text)" textLength="66" lengthAdjust="spacingAndGlyphs"><tspan x="0">V</tspan><tspan x="34">C</tspan></text>
    </svg>
  </a>
  <div class="navicons">
    <div class="round" id="theme-toggle" aria-label="테마 전환">
      <svg id="theme-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </div>
    <a class="round" href="index.html">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
  </div>
</nav>

<main class="wrap">
  <p class="notice">여기 올린 글은 모든 방문자에게 공개돼요. 글쓰기는 관리자만 할 수 있어요.</p>

  <div class="auth-panel" id="auth-panel">
    <div class="pane-label">관리자 로그인</div>
    <input type="email" id="auth-email" placeholder="이메일" autocomplete="username">
    <input type="password" id="auth-password" placeholder="비밀번호" autocomplete="current-password">
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-row">
      <button class="action save-btn" id="login-btn">로그인</button>
    </div>
    <div class="auth-row" style="margin-top:8px;">
      <button class="action clear-btn" id="google-login-btn">Google로 로그인</button>
    </div>
  </div>

  <div id="editor-wrap" class="hidden">
    <div class="auth-status">
      <span id="auth-email-label"></span>
      <button id="logout-btn">로그아웃</button>
    </div>

    <input class="title-input" id="post-title" placeholder="제목을 입력하세요">

    <div class="editor-grid">
      <div>
        <div class="pane-label">마크다운으로 작성</div>
        <textarea id="post-body" placeholder="여기에 마크다운으로 본문을 작성하세요.

## 소제목
문단 텍스트, **굵게**, *기울임*, [링크](https://example.com) 모두 지원돼요."></textarea>
      </div>
      <div>
        <div class="pane-label">미리보기</div>
        <div class="preview" id="preview"></div>
      </div>
    </div>

    <div class="toolbar">
      <button class="action save-btn" id="save-btn">저장하고 보기</button>
      <button class="action clear-btn" id="clear-btn">비우기</button>
    </div>
  </div>

  <div class="posts-title">모두의 글 목록</div>
  <ul class="post-list" id="post-list"></ul>
</main>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  var SUN = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4" y1="12" x2="2" y2="12"/><line x1="22" y1="12" x2="20" y2="12"/><line x1="19.07" y1="4.93" x2="17.66" y2="6.34"/><line x1="6.34" y1="17.66" x2="4.93" y2="19.07"/><line x1="19.07" y1="19.07" x2="17.66" y2="17.66"/><line x1="6.34" y1="6.34" x2="4.93" y2="4.93"/>';
  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var themeIcon = document.getElementById('theme-icon');
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    localStorage.setItem('theme', t);
    themeIcon.innerHTML = t === 'light' ? MOON : SUN;
  }
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('theme-toggle').addEventListener('click', function(){
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });

  var titleEl = document.getElementById('post-title');
  var bodyEl = document.getElementById('post-body');
  var previewEl = document.getElementById('preview');
  var authPanel = document.getElementById('auth-panel');
  var editorWrap = document.getElementById('editor-wrap');
  var authMsg = document.getElementById('auth-msg');
  var currentUser = null;

  function renderPreview(){
    var html = marked.parse(bodyEl.value || '');
    previewEl.innerHTML = DOMPurify.sanitize(html);
  }
  bodyEl.addEventListener('input', renderPreview);
  renderPreview();

  function setAuthUI(user){
    currentUser = user;
    authPanel.classList.toggle('hidden', !!user);
    editorWrap.classList.toggle('hidden', !user);
    if(user) document.getElementById('auth-email-label').textContent = user.email;
    renderPostList();
  }
  Auth.getSession().then(setAuthUI);
  Auth.onChange(setAuthUI);

  document.getElementById('login-btn').addEventListener('click', function(){
    var email = document.getElementById('auth-email').value.trim();
    var password = document.getElementById('auth-password').value;
    authMsg.textContent = '로그인 중…';
    Auth.login(email, password).then(function(res){
      authMsg.textContent = res.error ? res.error.message : '';
    });
  });
  document.getElementById('google-login-btn').addEventListener('click', function(){
    authMsg.textContent = '';
    Auth.loginWithGoogle().then(function(res){
      if(res.error) authMsg.textContent = res.error.message;
    });
  });
  document.getElementById('logout-btn').addEventListener('click', function(){
    Auth.logout();
  });

  document.getElementById('save-btn').addEventListener('click', function(){
    var title = titleEl.value.trim();
    var body = bodyEl.value.trim();
    if(!title || !body){ alert('제목과 본문을 모두 입력하세요.'); return; }
    if(!currentUser){ alert('로그인이 필요해요.'); return; }
    var btn = this;
    btn.disabled = true;
    btn.textContent = '올리는 중…';
    db.from('posts').insert({ title: title, body: body, user_id: currentUser.id, author_email: currentUser.email }).select().single()
      .then(function(res){
        if(res.error){ alert('올리기 실패: ' + res.error.message); btn.disabled = false; btn.textContent = '저장하고 보기'; return; }
        location.href = 'post.html?id=' + res.data.id;
      });
  });

  document.getElementById('clear-btn').addEventListener('click', function(){
    titleEl.value = '';
    bodyEl.value = '';
    renderPreview();
  });

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function renderPostList(){
    var listEl = document.getElementById('post-list');
    db.from('posts').select('id,title,created_at,user_id,author_email').order('created_at', {ascending:false})
      .then(function(res){
        if(res.error){ listEl.innerHTML = '<li class="empty">글 목록을 불러오지 못했어요.</li>'; return; }
        if(res.data.length === 0){ listEl.innerHTML = '<li class="empty">아직 작성한 글이 없어요.</li>'; return; }
        listEl.innerHTML = res.data.map(function(p){
          var date = new Date(p.created_at).toLocaleDateString('ko-KR');
          var mine = currentUser && p.user_id === currentUser.id;
          return '<li class="post-row">' +
            '<div><h3>' + escapeHtml(p.title) + '</h3><div class="post-date">' + date + (p.author_email ? ' · ' + escapeHtml(p.author_email) : '') + '</div></div>' +
            '<div class="post-actions"><a href="post.html?id=' + p.id + '">보기</a>' +
            (mine ? '<button data-del="' + p.id + '">삭제</button>' : '') +
            '</div>' +
          '</li>';
        }).join('');
      });
  }
  document.getElementById('post-list').addEventListener('click', function(e){
    var delId = e.target.getAttribute('data-del');
    if(delId && confirm('이 글을 삭제할까요?')){
      db.from('posts').delete().eq('id', delId).then(function(res){
        if(res.error){ alert('삭제 실패: ' + res.error.message); return; }
        renderPostList();
      });
    }
  });
</script>
</body>
</html>
