<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비저너리 · 비주얼매거진</title>
<style>
  @font-face{
    font-family:'Pretendard';
    src:url('vendor/fonts/Pretendard-SemiBold.woff2') format('woff2');
    font-weight:600;
    font-display:swap;
  }
  :root{
    --gold:#ffcf8a;
    --amber:#e8823c;
    --bg-top:#0d0d0d;
    --bg-mid:#1a1a1a;
    --bg-bottom:#262626;
    --text:#f2f2f2;
    --text-muted:rgba(242,242,242,.6);
    --surface:rgba(255,255,255,.06);
    --surface-border:rgba(255,255,255,.14);
  }
  :root[data-theme="light"]{
    --gold:#c97a2e;
    --amber:#b8571f;
    --bg-top:#ffffff;
    --bg-mid:#fafafa;
    --bg-bottom:#ededed;
    --text:#111111;
    --text-muted:rgba(17,17,17,.6);
    --surface:rgba(0,0,0,.05);
    --surface-border:rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 550px at 50% 0%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 70%),
      linear-gradient(180deg,var(--bg-top),var(--bg-mid) 45%,var(--bg-bottom) 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px;}

  nav{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    background:rgba(10,10,10,.4);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--surface-border);
  }
  .navicons{display:flex;gap:10px;}
  .round{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);
  }

  main{padding:40px 0 100px;}
  .page-title{font-size:26px;font-weight:800;margin-bottom:6px;}
  .page-sub{font-size:13px;color:var(--text-muted);margin-bottom:28px;line-height:1.6;}

  .feed-list{list-style:none;}
  .feed-row{padding:16px 0;border-bottom:1px solid var(--surface-border);}
  .feed-row:last-child{border-bottom:none;}
  .feed-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}
  .feed-name{font-weight:800;font-size:14px;}
  .feed-rate{font-weight:800;font-size:14px;flex:none;}
  .feed-rate.pos{color:#7dd88a;}
  .feed-rate.neg{color:var(--amber);}
  .feed-pending{flex:none;font-size:12px;color:var(--text-muted);}
  .feed-statement{font-size:14px;line-height:1.6;color:var(--text);}
  .feed-dir{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  .feed-dir.up{background:color-mix(in srgb, #7dd88a 20%, transparent);color:#7dd88a;}
  .feed-dir.down{background:color-mix(in srgb, var(--amber) 20%, transparent);color:var(--amber);}

  .note{font-size:12px;line-height:1.7;color:var(--text-muted);margin-top:28px;padding-top:20px;border-top:1px solid var(--surface-border);}
  .empty-note{font-size:13px;color:var(--text-muted);padding:16px 0;}
</style>
</head>
<body>

<nav>
  <a class="logo-lockup" href="index.html">
    <svg class="logo-mark" viewBox="0 0 100 34" width="50" height="17" aria-label="VC">
      <g transform="scale(1.47,1)">
        <text y="27" font-family="Pretendard, sans-serif" font-weight="600" font-size="34" letter-spacing="-0.015em" fill="var(--text)">VC</text>
      </g>
    </svg>
  </a>
  <div class="navicons">
    <div class="round" id="theme-toggle" aria-label="테마 전환">
      <svg id="theme-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </div>
    <a class="round" href="index.html" aria-label="홈으로">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
  </div>
</nav>

<main class="wrap">
  <div class="page-title">비저너리</div>
  <p class="page-sub">경제 유튜버·인플루언서 발언 기록 · 최신순 · 특정 종목 매매를 권유하지 않습니다</p>

  <ul class="feed-list" id="feed-list">
    <li class="empty-note">불러오는 중…</li>
  </ul>

  <p class="note">판정은 부호(적중·빗나감)뿐 아니라 같은 기간 벤치마크 대비 초과수익도 함께 봅니다. 판정 전인 발언은 수익률을 표시하지 않습니다 — 아직 결과가 안 나온 걸 0%로 오해하지 않도록요. 이 기록은 발언-결과를 남기는 것일 뿐 인물 평가나 투자 조언이 아니며, 판단과 그 결과의 책임은 전적으로 본인에게 있습니다.</p>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
  var SUN = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4" y1="12" x2="2" y2="12"/><line x1="22" y1="12" x2="20" y2="12"/><line x1="19.07" y1="4.93" x2="17.66" y2="6.34"/><line x1="6.34" y1="17.66" x2="4.93" y2="19.07"/><line x1="19.07" y1="19.07" x2="17.66" y2="17.66"/><line x1="6.34" y1="6.34" x2="4.93" y2="4.93"/>';
  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var themeIcon = document.getElementById('theme-icon');
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    localStorage.setItem('theme', t);
    themeIcon.innerHTML = t === 'light' ? MOON : SUN;
  }
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('theme-toggle').addEventListener('click', function(){
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });

  function esc(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  fetch(SUPABASE_URL + '/functions/v1/super-action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
    body: JSON.stringify({ action: 'visionary-feed', limit: 50 })
  }).then(function(r){ return r.json(); }).then(function(result){
    renderFeed(result.rows || []);
  }).catch(function(){
    document.getElementById('feed-list').innerHTML = '<li class="empty-note">불러오지 못했어요. 잠시 후 다시 시도해주세요.</li>';
  });

  function renderFeed(rows){
    var list = document.getElementById('feed-list');
    if(rows.length === 0){
      list.innerHTML = '<li class="empty-note">아직 수집된 발언이 없어요.</li>';
      return;
    }
    list.innerHTML = rows.map(function(r){
      var rateHtml = r.excessReturn == null
        ? '<span class="feed-pending">판정 전</span>'
        : '<span class="feed-rate ' + (r.excessReturn >= 0 ? 'pos' : 'neg') + '">' +
            (r.excessReturn >= 0 ? '+' : '') + r.excessReturn.toFixed(1) + '%</span>';
      var dirHtml = '<span class="feed-dir ' + (r.direction === 'up' ? 'up' : 'down') + '">' +
        (r.direction === 'up' ? '간다' : '빠진다') + '</span>';
      return '<li class="feed-row">' +
        '<div class="feed-top"><span class="feed-name">' + esc(r.name) + dirHtml + '</span>' + rateHtml + '</div>' +
        '<div class="feed-statement">' + esc(r.statement) + '</div>' +
      '</li>';
    }).join('');
  }
</script>
</body>
</html>
