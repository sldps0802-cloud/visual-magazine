<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 보기 · 비주얼매거진</title>
<style>
  :root{
    --gold:#ffcf8a;
    --amber:#e8823c;
    --bg-top:#2a1206;
    --bg-mid:#5a2f12;
    --bg-bottom:#8a4a1f;
    --text:#f5e9da;
    --text-muted:rgba(245,233,218,.6);
    --surface:rgba(255,255,255,.06);
    --surface-border:rgba(255,255,255,.14);
    --btn-bg:#f5e9da;
    --btn-text:#2a1206;
    --word-step:30ms;
    --word-cap:900ms;
    --word-dur:.5s;
  }
  :root[data-theme="light"]{
    --gold:#c97a2e;
    --amber:#b8571f;
    --bg-top:#fffaf3;
    --bg-mid:#fbead0;
    --bg-bottom:#f3d19d;
    --text:#2a1206;
    --text-muted:rgba(42,18,6,.6);
    --surface:rgba(42,18,6,.05);
    --surface-border:rgba(42,18,6,.12);
    --btn-bg:#2a1206;
    --btn-text:#fffaf3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-top),var(--bg-mid) 45%,var(--bg-bottom) 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px;}

  nav{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    background:rgba(20,8,4,.4);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--surface-border);
  }
  .logo-lockup{display:flex;align-items:center;gap:8px;}
  .logo-mark{font-size:19px;font-weight:900;letter-spacing:-.09em;color:var(--text);}
  .logo-name{
    font-size:15px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),var(--amber),var(--gold));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .round{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);
  }

  main{padding:48px 0 100px;}
  .headline{font-size:32px;line-height:1.4;font-weight:800;margin-bottom:16px;text-shadow:0 0 28px rgba(255,190,120,.3);}
  .meta{font-size:13px;color:var(--text-muted);margin-bottom:36px;}

  .body-content h1,.body-content h2,.body-content h3{margin:1.2em 0 .5em;line-height:1.4;}
  .body-content p{margin:.8em 0;line-height:1.9;font-size:16px;}
  .body-content a{color:var(--amber);text-decoration:underline;}
  .body-content ul,.body-content ol{margin:.8em 0 .8em 1.3em;}
  .body-content blockquote{border-left:3px solid var(--amber);padding-left:14px;color:var(--text-muted);margin:1em 0;}
  .body-content code{background:var(--surface);padding:2px 6px;border-radius:4px;font-size:14px;}
  .body-content img{max-width:100%;border-radius:10px;}

  /* ---- one-shot reveal on enter: whole-block fade for non-text blocks ---- */
  .body-content .reading{
    opacity:0;transform:translateY(16px);
    transition:opacity .6s cubic-bezier(.34,1.56,.64,1),transform .6s cubic-bezier(.34,1.56,.64,1);
  }
  .body-content .reading.reveal-in{
    opacity:1;transform:translateY(0);
  }
  /* ---- word-by-word left-to-right sweep for paragraph text ---- */
  .body-content .reading.reading-lines{opacity:1;transform:none;transition:none;}
  .body-content .word{display:inline-block;color:var(--text-muted);opacity:.5;}
  .body-content .reading-lines.reveal-in .word{
    animation:word-reveal var(--word-dur,.5s) cubic-bezier(.34,1.56,.64,1) both;
    animation-delay:min(calc(var(--i) * var(--word-step)), var(--word-cap));
  }
  @keyframes word-reveal{
    0%{color:var(--text-muted);opacity:.5;}
    55%{color:var(--amber);opacity:1;}
    100%{color:var(--text);opacity:1;}
  }

  .not-found{padding:80px 0;text-align:center;color:var(--text-muted);}
  .not-found a{color:var(--amber);text-decoration:underline;}

  .panel-eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.08em;
    color:var(--amber);margin-bottom:10px;
  }
  .divide,.skipped{width:100%;text-align:left;margin-bottom:16px;}
  summary{list-style:none;cursor:pointer;}
  summary::-webkit-details-marker{display:none;}
  summary::marker{content:'';}
  .feature-banner{
    display:flex;flex-direction:column;position:relative;
    border-radius:16px;overflow:hidden;
    transition:filter .15s ease-out;
  }
  summary:hover .feature-banner{filter:brightness(1.06);}
  .feature-toggle{
    position:absolute;top:16px;right:16px;z-index:1;
    width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#f5e9da;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease-out;
  }
  details[open] .feature-toggle{transform:rotate(180deg);}
  .divide-detail,.skipped-detail{margin-top:16px;}
  .feature-visual{
    background:linear-gradient(160deg,var(--gold),var(--amber));
    min-height:150px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .feature-panel{background:#20120a;color:#f5e9da;padding:20px;}
  .feature-badge{
    display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:#ffcf8a;margin-bottom:10px;
  }
  .feature-banner-title{font-size:19px;line-height:1.4;font-weight:800;margin-bottom:10px;}
  .feature-banner-desc{font-size:13px;line-height:1.7;color:rgba(245,233,218,.7);margin-bottom:16px;}
  .feature-banner-meta{font-size:12px;color:rgba(245,233,218,.45);}
  @media (min-width:600px){
    .feature-banner{flex-direction:row;}
    .feature-visual{width:38%;min-height:auto;}
    .feature-panel{width:62%;}
  }
  .divide-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .divide-card{background:var(--surface);border:1px solid var(--surface-border);border-radius:12px;padding:14px;}
  .divide-card.accent{
    background:color-mix(in srgb, var(--amber) 10%, transparent);
    border-color:color-mix(in srgb, var(--amber) 45%, transparent);
  }
  .source-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px;}
  .source-row em{font-weight:400;font-style:normal;color:var(--text-muted);}
  .source-badge{
    width:22px;height:22px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-border);font-size:11px;font-weight:700;
  }
  .divide-card blockquote{font-size:14px;line-height:1.6;color:var(--text);opacity:.85;margin-bottom:10px;border:none;padding-left:0;}
  .source-link{font-size:13px;font-weight:600;color:var(--amber);}
  .wc-loading,.wc-empty{
    font-size:13px;color:var(--text-muted);
    background:var(--surface);border:1px solid var(--surface-border);
    border-radius:14px;padding:16px;
  }
  .wc-note{font-size:11px;color:var(--text-muted);opacity:.7;margin-top:10px;}
  .skipped-box{
    background:var(--surface);border:1px solid var(--surface-border);
    border-radius:16px;padding:20px;
  }
  .skipped-list{list-style:none;}
  .skipped-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--surface-border);}
  .skipped-list li:last-child .skipped-row{border-bottom:none;padding-bottom:0;}
  .skipped-list li:first-child .skipped-row{padding-top:0;}
  .skipped-title{font-size:14px;font-weight:600;margin-bottom:8px;}
  .coverage-dots{display:flex;gap:4px;margin-bottom:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--surface-border);}
  .dot.on{background:#2ecc71;}
  .skipped-meta{font-size:12px;color:var(--text-muted);}
  .chevron{color:var(--text-muted);flex:none;margin-top:2px;}
  @media (min-width:600px){ .divide-grid{grid-template-columns:1fr 1fr;} }

  /* ---- engagement bar + comments ---- */
  .engage-bar{
    display:flex;align-items:center;gap:20px;padding:16px 0;
    border-top:1px solid var(--surface-border);border-bottom:1px solid var(--surface-border);
    margin:36px 0 28px;font-size:14px;color:var(--text-muted);
  }
  .like-btn,.comment-count{display:flex;align-items:center;gap:6px;}
  .like-btn{background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:14px;cursor:pointer;padding:0;}
  .like-btn svg{width:18px;height:18px;}
  .like-btn.liked{color:var(--amber);}
  .like-btn.liked svg{fill:var(--amber);}
  .like-btn:disabled{cursor:default;}

  .comment-form{margin-bottom:32px;}
  .comment-identity{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .comment-avatar{
    width:36px;height:36px;border-radius:50%;flex:none;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;
  }
  .comment-nickname{font-weight:700;font-size:14px;}
  .reroll-btn{
    font-size:12px;padding:4px 10px;border-radius:999px;font-family:inherit;cursor:pointer;
    background:var(--surface);border:1px solid var(--surface-border);color:var(--text);
  }
  .info-btn{
    width:18px;height:18px;border-radius:50%;flex:none;margin-left:auto;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:none;border:1px solid var(--text-muted);color:var(--text-muted);
    font-size:11px;font-family:inherit;cursor:pointer;padding:0;
  }
  .info-tooltip{
    position:absolute;top:calc(100% + 8px);right:0;z-index:3;width:220px;
    background:#20120a;color:#f5e9da;font-size:12px;line-height:1.6;text-align:left;
    padding:12px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .comment-input-row{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--surface-border);border-radius:999px;
    padding:6px 6px 6px 16px;margin-bottom:10px;
  }
  .comment-input{
    flex:1;min-width:0;border:none;background:none;outline:none;
    color:var(--text);font-family:inherit;font-size:14px;padding:8px 0;
  }
  .comment-submit{
    width:32px;height:32px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--amber);color:#fff;border:none;cursor:pointer;
  }
  .comment-submit svg{width:16px;height:16px;}
  .comment-msg{font-size:12px;color:var(--amber);padding-left:16px;min-height:14px;}

  .comment-list{list-style:none;clear:both;}
  .comment-row{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--surface-border);}
  .comment-row:last-child{border-bottom:none;}
  .comment-main{flex:1;min-width:0;}
  .comment-body{font-size:14px;line-height:1.6;color:var(--text);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  .comment-ip-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:2;
    background:#20120a;color:#f5e9da;font-size:11px;padding:8px 10px;border-radius:8px;
    white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .comment-empty{font-size:13px;color:var(--text-muted);padding:8px 0;}
</style>
</head>
<body>

<nav>
  <a class="logo-lockup" href="index.html">
    <span class="logo-mark">VC</span>
    <span class="logo-name">비주얼매거진</span>
  </a>
</nav>

<main class="wrap" id="main"></main>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
  applyStoredTheme();
  function applyStoredTheme(){
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
  }

  var id = new URLSearchParams(location.search).get('id');
  var main = document.getElementById('main');

  if(!id){
    main.innerHTML = '<div class="not-found">글을 찾을 수 없어요. <a href="index.html">홈으로 돌아가기</a></div>';
  } else {
    main.innerHTML = '<div class="wc-loading">불러오는 중…</div>';
    db.from('posts').select('*').eq('id', id).single().then(function(res){
      if(res.error || !res.data){
        main.innerHTML = '<div class="not-found">글을 찾을 수 없어요. <a href="index.html">홈으로 돌아가기</a></div>';
        return;
      }
      renderPost(res.data);
      // keepalive: rpc must survive if the user navigates away right after page load
      fetch(SUPABASE_URL + '/rest/v1/rpc/increment_views', {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({ post_id: res.data.id })
      });
    });
  }

  function renderPost(post){
    main.innerHTML = '';
    var date = new Date(post.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    var titleEl = document.createElement('h1');
    titleEl.className = 'headline';
    titleEl.textContent = post.title;
    var metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = post.author_email ? (post.author_email + ' · ' + date) : date;
    var divideEl = document.createElement('div');
    divideEl.innerHTML =
      '<details class="divide" data-topic="' + wcEscape(post.title) + '">' +
        '<summary class="feature-banner">' +
          '<div class="feature-visual">' +
            '<svg viewBox="0 0 160 120" width="130" height="98" fill="none">' +
              '<rect x="8" y="14" width="86" height="56" rx="14" fill="#20120a"/>' +
              '<path d="M20 70 L20 86 L38 70 Z" fill="#20120a"/>' +
              '<rect x="62" y="46" width="92" height="56" rx="14" fill="#fff8ef"/>' +
              '<path d="M150 102 L150 118 L132 102 Z" fill="#fff8ef"/>' +
            '</svg>' +
          '</div>' +
          '<div class="feature-panel">' +
            '<div class="feature-toggle">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
            '</div>' +
            '<div class="feature-badge">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>' +
              '엇갈린 시선' +
            '</div>' +
            '<div class="feature-banner-title">전 세계 언론은 이 소식을 다르게 다룹니다</div>' +
            '<div class="feature-banner-desc">8개 대륙 권역 + 한·미·일 대표 언론 + 구글 뉴스에서 같은 주제의 기사를 실시간으로 찾아 시각차를 비교해요.</div>' +
            '<div class="feature-banner-meta">눌러서 비교해보기</div>' +
          '</div>' +
        '</summary>' +
        '<div class="divide-detail"></div>' +
      '</details>' +
      '<details class="skipped" data-topic="' + wcEscape(post.title) + '">' +
        '<summary class="feature-banner">' +
          '<div class="feature-visual">' +
            '<svg viewBox="0 0 160 120" width="130" height="98" fill="none">' +
              '<circle cx="35" cy="60" r="20" fill="#2ecc71"/>' +
              '<circle cx="80" cy="60" r="20" fill="none" stroke="#20120a" stroke-width="4"/>' +
              '<circle cx="125" cy="60" r="20" fill="none" stroke="#20120a" stroke-width="4"/>' +
            '</svg>' +
          '</div>' +
          '<div class="feature-panel">' +
            '<div class="feature-toggle">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
            '</div>' +
            '<div class="feature-badge">' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="1.6" fill="currentColor" stroke="none"/><line x1="10" y1="6" x2="21" y2="6"/><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><line x1="10" y1="12" x2="21" y2="12"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/><line x1="10" y1="18" x2="21" y2="18"/></svg>' +
              '놓친 이야기' +
            '</div>' +
            '<div class="feature-banner-title">어느 지역 언론은 다루지 않았을까요</div>' +
            '<div class="feature-banner-desc">같은 권역·매체를 확인해서 이 소식을 놓친 곳이 있는지 보여줘요.</div>' +
            '<div class="feature-banner-meta">눌러서 확인하기</div>' +
          '</div>' +
        '</summary>' +
        '<div class="skipped-detail"></div>' +
      '</details>';
    var bodyEl = document.createElement('div');
    bodyEl.className = 'body-content';
    bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(post.body));
    Array.from(bodyEl.children).forEach(function(el){
      el.classList.add('reading');
      if(/^(P|H1|H2|H3|H4|BLOCKQUOTE)$/.test(el.tagName)){
        el.classList.add('reading-lines');
        splitIntoWords(el);
      }
    });
    main.appendChild(titleEl);
    main.appendChild(metaEl);
    main.appendChild(divideEl);
    var engageEl = document.createElement('div');
    engageEl.innerHTML =
      '<div class="engage-bar">' +
        '<button class="like-btn" id="like-btn">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
          '<span id="like-count">' + (post.likes || 0) + '</span>' +
        '</button>' +
        '<div class="comment-count">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
          '<span id="comment-count">0</span>' +
        '</div>' +
      '</div>' +
      '<div class="comment-form">' +
        '<div class="comment-identity">' +
          '<div class="comment-avatar" id="my-avatar"></div>' +
          '<span class="comment-nickname" id="my-nickname"></span>' +
          '<button class="reroll-btn" id="reroll-btn">랜덤 변경</button>' +
          '<button class="info-btn" id="info-btn" aria-label="안내">i</button>' +
        '</div>' +
        '<div class="comment-input-row">' +
          '<input type="text" class="comment-input" id="comment-input" placeholder="댓글을 남겨보세요" maxlength="500">' +
          '<button class="comment-submit" id="comment-submit" aria-label="댓글 남기기">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="comment-msg" id="comment-msg"></div>' +
      '</div>' +
      '<ul class="comment-list" id="comment-list"></ul>';
    main.appendChild(engageEl);
    document.title = post.title + ' · 비주얼매거진';

    wireWorldCoverage(post, main.querySelector('.divide'), main.querySelector('.skipped'));
    wireReadingReveal();
    wireComments(post);
  }

  /* ---- wraps each word (or inline element) in its own span with a stagger index,
     so CSS can animate the reveal word-by-word, left to right, line by line ---- */
  function splitIntoWords(el){
    var i = 0;
    Array.from(el.childNodes).forEach(function(node){
      if(node.nodeType === Node.TEXT_NODE){
        var frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(function(part){
          if(part === '') return;
          if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
          var span = document.createElement('span');
          span.className = 'word';
          span.style.setProperty('--i', i++);
          span.textContent = part;
          frag.appendChild(span);
        });
        el.replaceChild(frag, node);
      } else if(node.nodeType === Node.ELEMENT_NODE){
        var wrapper = document.createElement('span');
        wrapper.className = 'word';
        wrapper.style.setProperty('--i', i++);
        el.replaceChild(wrapper, node);
        wrapper.appendChild(node);
      }
    });
  }

  /* ---- reveal blocks one at a time in document order, gradient speeding up
     as it goes (normal -> fast). at 1.7s, whatever's left (the whole rest of
     the article, not just one block) pops to normal color together, all at
     once - but only once whichever block is still mid-flight actually
     finishes, so it can never visually overtake it. ---- */
  var TIERS = {
    normal:  {step:30, cap:900, dur:500, blockDur:600},
    fast:    {step:6,  cap:150, dur:300, blockDur:200},
    instant: {step:0,  cap:0,   dur:150, blockDur:0}
  };
  function wireReadingReveal(){
    var blocks = Array.from(document.querySelectorAll('.reading'));
    var revealed = new Array(blocks.length).fill(false);
    var startTime = Date.now();
    var stopped = false;
    var activeIO = null;
    var animatingUntil = 0;
    var i = 0;

    function tierFor(t){ return t >= 1000 ? 'fast' : 'normal'; }

    function next(){
      if(stopped || i >= blocks.length) return;
      var idx = i++;
      var el = blocks[idx];
      activeIO = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(!entry.isIntersecting) return;
          activeIO.unobserve(el);
          setGradientSpeed(tierFor(Date.now() - startTime));
          revealed[idx] = true;
          el.classList.add('reveal-in');
          var dur = blockRevealDuration(el);
          animatingUntil = Date.now() + dur;
          setTimeout(next, dur);
        });
      }, {threshold:0.3});
      activeIO.observe(el);
    }
    next();

    function massRevealWhenReady(){
      var wait = Math.max(0, animatingUntil - Date.now());
      setTimeout(function(){
        if(Date.now() < animatingUntil){ massRevealWhenReady(); return; }
        stopped = true;
        if(activeIO) activeIO.disconnect();
        setGradientSpeed('instant');
        blocks.forEach(function(el, idx){
          if(revealed[idx]) return;
          revealed[idx] = true;
          el.classList.add('reveal-in');
        });
      }, wait);
    }
    setTimeout(massRevealWhenReady, 1700);
  }
  var currentTier = 'normal';
  function setGradientSpeed(tier){
    if(currentTier === tier) return;
    currentTier = tier;
    var cfg = TIERS[tier];
    document.documentElement.style.setProperty('--word-step', cfg.step + 'ms');
    document.documentElement.style.setProperty('--word-cap', cfg.cap + 'ms');
    document.documentElement.style.setProperty('--word-dur', cfg.dur + 'ms');
  }
  function blockRevealDuration(el){
    var cfg = TIERS[currentTier];
    if(!el.classList.contains('reading-lines')) return cfg.blockDur;
    var wordCount = el.querySelectorAll('.word').length;
    return Math.min((wordCount - 1) * cfg.step, cfg.cap) + cfg.dur + 100;
  }

  /* ---- comments + likes: random nickname/avatar, submitted through the
     submit-comment Edge Function (never straight to Postgres) so VPN/IP
     checks can't be bypassed by calling the REST API directly. ---- */
  var COMMENT_ADJS = ['씩씩한','유쾌한','다정한','용감한','엉뚱한','차분한','활발한','느긋한','상냥한','똑똑한','부지런한','소심한','명랑한','시크한','든든한','살가운','재빠른','어여쁜','늠름한','수줍은'];
  var COMMENT_ANIMALS = {
    '치타':'🐆','알파카':'🦙','사자':'🦁','여우':'🦊','곰':'🐻','토끼':'🐰','고양이':'🐱','강아지':'🐶',
    '판다':'🐼','펭귄':'🐧','코알라':'🐨','다람쥐':'🐿️','부엉이':'🦉','수달':'🦦','하마':'🦛','기린':'🦒',
    '호랑이':'🐯','늑대':'🐺','오소리':'🦡','낙타':'🐫'
  };
  var AVATAR_COLORS = ['#ffd9a8','#a8d8ff','#c9a8ff','#a8ffd0','#ffb8d0','#ffe9a8','#a8f0ff','#d0ffa8'];
  // 대시보드에서 함수 이름이 'submit-comment'가 아니라 'super-action'으로 배포됨
  var COMMENT_FN_URL = SUPABASE_URL + '/functions/v1/super-action';
  var myIdentity = null;

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function rollIdentity(){
    var animals = Object.keys(COMMENT_ANIMALS);
    var adj = pick(COMMENT_ADJS), animal = pick(animals);
    var nickname = adj + animal;
    var colorIdx = 0;
    for(var i = 0; i < nickname.length; i++) colorIdx += nickname.charCodeAt(i);
    myIdentity = { nickname: nickname, emoji: COMMENT_ANIMALS[animal], color: AVATAR_COLORS[colorIdx % AVATAR_COLORS.length] };
    return myIdentity;
  }
  function paintIdentity(){
    var av = document.getElementById('my-avatar');
    av.style.background = myIdentity.color;
    av.textContent = myIdentity.emoji;
    document.getElementById('my-nickname').textContent = myIdentity.nickname;
  }
  function commentAvatarHtml(nickname, emoji, ipLabel){
    var colorIdx = 0;
    for(var i = 0; i < nickname.length; i++) colorIdx += nickname.charCodeAt(i);
    var color = AVATAR_COLORS[colorIdx % AVATAR_COLORS.length];
    var ipAttr = ipLabel ? ' data-ip="' + wcEscape(ipLabel) + '"' : '';
    return '<div class="comment-avatar" style="background:' + color + '"' + ipAttr + '>' + emoji + '</div>';
  }
  function animalOf(nickname){
    var animals = Object.keys(COMMENT_ANIMALS);
    for(var i = 0; i < animals.length; i++){ if(nickname.indexOf(animals[i]) !== -1) return animals[i]; }
    return null;
  }

  function wireComments(post){
    rollIdentity();
    paintIdentity();
    document.getElementById('reroll-btn').addEventListener('click', function(){
      rollIdentity();
      paintIdentity();
    });

    document.getElementById('info-btn').addEventListener('click', function(e){
      e.stopPropagation();
      var existing = this.querySelector('.info-tooltip');
      if(existing){ existing.remove(); return; }
      var tip = document.createElement('div');
      tip.className = 'info-tooltip';
      tip.textContent = '입력한 댓글은 수정·삭제가 어려워요. 접속 국가가 함께 표시돼요. 부적절한 내용은 삭제될 수 있어요.';
      this.appendChild(tip);
    });
    document.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('#info-btn')) return;
      var tip = document.querySelector('.info-tooltip');
      if(tip) tip.remove();
    });

    document.getElementById('comment-input').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('comment-submit').click(); }
    });

    var likeBtn = document.getElementById('like-btn');
    var likedKey = 'liked_post_' + post.id;
    if(localStorage.getItem(likedKey)) likeBtn.classList.add('liked');
    likeBtn.addEventListener('click', function(){
      if(localStorage.getItem(likedKey)) return;
      likeBtn.disabled = true;
      fetch(COMMENT_FN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({ action: 'like', post_id: post.id })
      }).then(function(r){ return r.json(); }).then(function(res){
        likeBtn.disabled = false;
        if(res.error){ alert(res.error); return; }
        localStorage.setItem(likedKey, '1');
        likeBtn.classList.add('liked');
        var countEl = document.getElementById('like-count');
        countEl.textContent = Number(countEl.textContent) + 1;
      }).catch(function(){ likeBtn.disabled = false; });
    });

    document.getElementById('comment-submit').addEventListener('click', function(){
      var input = document.getElementById('comment-input');
      var text = input.value.trim();
      var msg = document.getElementById('comment-msg');
      if(!text){ msg.textContent = '댓글 내용을 입력하세요.'; return; }
      var btn = this;
      btn.disabled = true;
      msg.textContent = '올리는 중…';
      fetch(COMMENT_FN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({ action: 'comment', post_id: post.id, nickname: myIdentity.nickname, avatar_seed: myIdentity.nickname, body: text })
      }).then(function(r){ return r.json(); }).then(function(res){
        btn.disabled = false;
        if(res.error){ msg.textContent = res.error; return; }
        msg.textContent = '';
        input.value = '';
        loadComments(post.id);
      }).catch(function(){ btn.disabled = false; msg.textContent = '올리기 실패, 다시 시도해주세요.'; });
    });

    loadComments(post.id);
  }

  function loadComments(postId){
    db.from('comments').select('*').eq('post_id', postId).order('created_at', {ascending:false}).then(function(res){
      var list = document.getElementById('comment-list');
      var comments = res.data || [];
      document.getElementById('comment-count').textContent = comments.length;
      if(comments.length === 0){
        list.innerHTML = '<li class="comment-empty">첫 댓글을 남겨보세요.</li>';
        return;
      }
      list.innerHTML = comments.map(function(c){
        var emoji = COMMENT_ANIMALS[animalOf(c.nickname)] || '🐾';
        var ipLabel = (c.ip_prefix || '알 수 없음') + '.*.* · ' + (c.country || '?');
        return '<li class="comment-row">' +
          commentAvatarHtml(c.nickname, emoji, ipLabel) +
          '<div class="comment-main">' +
            '<span class="comment-nickname">' + wcEscape(c.nickname) + '</span>' +
            '<div class="comment-body">' + wcEscape(c.body) + '</div>' +
          '</div>' +
        '</li>';
      }).join('');
    });
  }
  document.addEventListener('click', function(e){
    var av = e.target.closest && e.target.closest('.comment-avatar[data-ip]');
    document.querySelectorAll('.comment-ip-panel').forEach(function(p){ p.remove(); });
    if(!av) return;
    var panel = document.createElement('div');
    panel.className = 'comment-ip-panel';
    panel.textContent = av.dataset.ip;
    av.appendChild(panel);
  });

  /* ---- world coverage: live RSS by region, matched to this post's title ---- */
  var WC_REGIONS = [
    {name:'동아시아',   source:'South China Morning Post', feed:'https://www.scmp.com/rss/91/feed', lang:'en'},
    {name:'중앙아시아', source:'Eurasianet',                feed:'https://eurasianet.org/rss', lang:'en'},
    {name:'남아시아',   source:'The Hindu',                 feed:'https://www.thehindu.com/news/international/feeder/default.rss', lang:'en'},
    {name:'동남아시아', source:'Bangkok Post',              feed:'https://www.bangkokpost.com/rss/data/topstories.xml', lang:'en'},
    {name:'중동',       source:'Al Jazeera',                feed:'https://www.aljazeera.com/xml/rss/all.xml', lang:'en'},
    {name:'아프리카',   source:'AllAfrica',                 feed:'https://allafrica.com/tools/headlines/rdf/latest/headlines.rdf', lang:'en'},
    {name:'유럽',       source:'Euronews',                  feed:'https://www.euronews.com/rss?level=theme&name=news', lang:'en'},
    {name:'아메리카',   source:'Global Voices',             feed:'https://globalvoices.org/-/world/americas/feed/', lang:'en'},
    {name:'한국',       source:'연합뉴스',                  feed:'https://www.yna.co.kr/rss/news.xml', lang:'ko'},
    {name:'미국',       source:'The New York Times',        feed:'https://rss.nytimes.com/services/xml/rss/nyt/World.xml', lang:'en'},
    {name:'일본',       source:'NHK뉴스',                   feed:'https://www3.nhk.or.jp/rss/news/cat0.xml', lang:'ja'}
  ];
  var WC_PROXY = 'https://api.allorigins.win/raw?url=';
  var WC_GOOGLE = {name:'구글 뉴스', source:'Google News', lang:'en'};
  function wcGoogleFeedUrl(topic){
    return 'https://news.google.com/rss/search?q=' + encodeURIComponent(topic) + '&hl=en-US&gl=US&ceid=US:en';
  }

  function wcDetectLang(text){
    return /[가-힣]/.test(text) ? 'ko' : 'en';
  }
  var wcTranslateCache = {};
  function wcTranslate(text, targetLang){
    var srcLang = wcDetectLang(text);
    if(srcLang === targetLang) return Promise.resolve(text);
    var key = srcLang + '|' + targetLang + ':' + text;
    if(wcTranslateCache[key]) return wcTranslateCache[key];
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 8000);
    wcTranslateCache[key] = fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + srcLang + '|' + targetLang, {signal: ctrl.signal})
      .then(function(r){ clearTimeout(timer); return r.json(); })
      .then(function(data){
        return (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
      })
      .catch(function(){ clearTimeout(timer); return text; });
    return wcTranslateCache[key];
  }
  var WC_STOPWORDS = {
    'the':1,'a':1,'an':1,'of':1,'to':1,'in':1,'on':1,'for':1,'and':1,'or':1,'is':1,'are':1,'was':1,'were':1,
    'with':1,'at':1,'by':1,'from':1,'as':1,'it':1,'its':1,'this':1,'that':1,'be':1,'has':1,'have':1,'will':1,'not':1,
    '이':1,'그':1,'저':1,'것':1,'수':1,'등':1,'및':1,'을':1,'를':1,'은':1,'는':1,'에':1,'의':1,'가':1,'과':1,'와':1,'도':1,'로':1,'으로':1,'에서':1
  };
  function wcTokenize(text){
    return (text || '').toLowerCase()
      .split(/[\s,."'?!:;()\[\]〈〉《》·\-–—]+/)
      .filter(function(w){ return w.length >= 3 && !WC_STOPWORDS[w]; });
  }
  function wcKeywords(text){
    return wcTokenize(text);
  }
  function wcScore(item, keywords){
    var haySet = {};
    wcTokenize(item.title + ' ' + (item.description || '')).forEach(function(w){ haySet[w] = true; });
    var score = 0;
    keywords.forEach(function(k){ if(haySet[k]) score++; });
    return score;
  }
  function wcEscape(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function wcParseXML(xmlText){
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if(doc.querySelector('parsererror')) return [];
    var nodes = doc.querySelectorAll('item');
    if(nodes.length === 0) nodes = doc.querySelectorAll('entry'); // Atom fallback
    return Array.from(nodes).map(function(el){
      var titleEl = el.querySelector('title');
      var linkEl = el.querySelector('link');
      var descEl = el.querySelector('description') || el.querySelector('summary');
      var link = linkEl ? (linkEl.getAttribute('href') || linkEl.textContent) : '';
      return {
        title: titleEl ? titleEl.textContent.trim() : '',
        link: (link || '').trim(),
        description: descEl ? descEl.textContent.trim() : ''
      };
    });
  }
  var wcPromiseCache = {};
  function wcFetchOne(region, keywords){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 8000);
    return fetch(WC_PROXY + encodeURIComponent(region.feed), {signal: ctrl.signal})
      .then(function(r){ clearTimeout(timer); return r.text(); })
      .then(function(xmlText){
        var items = wcParseXML(xmlText);
        var minScore = keywords.length >= 3 ? 2 : 1;
        var best = null, bestScore = 0;
        items.forEach(function(item){
          var s = wcScore(item, keywords);
          if(s > bestScore){ bestScore = s; best = item; }
        });
        return {region:region.name, source:region.source, item:best, matched: bestScore >= minScore};
      })
      .catch(function(){ clearTimeout(timer); return {region:region.name, source:region.source, item:null, matched:false, failed:true}; });
  }
  function wcFetchAll(topic, onProgress){
    if(wcPromiseCache[topic]) return wcPromiseCache[topic];
    var regions = WC_REGIONS.concat([{name:WC_GOOGLE.name, source:WC_GOOGLE.source, feed:wcGoogleFeedUrl(topic), lang:WC_GOOGLE.lang}]);
    var langs = regions.map(function(r){ return r.lang; }).filter(function(v, i, a){ return a.indexOf(v) === i; });
    wcPromiseCache[topic] = Promise.all(langs.map(function(lang){
      return wcTranslate(topic, lang).then(function(t){ return [lang, wcKeywords(t)]; });
    })).then(function(pairs){
      var keywordsByLang = {};
      pairs.forEach(function(p){ keywordsByLang[p[0]] = p[1]; });
      var total = regions.length;
      var done = 0;
      return Promise.all(regions.map(function(region){
        return wcFetchOne(region, keywordsByLang[region.lang] || wcKeywords(topic)).then(function(r){
          done++;
          if(onProgress) onProgress(done, total);
          return r;
        });
      }));
    });
    return wcPromiseCache[topic];
  }

  function wcRenderDivide(container, results){
    var matched = results.filter(function(r){ return r.matched; });
    if(matched.length === 0){
      container.innerHTML = '<div class="wc-empty">지금은 이 주제와 일치하는 해외 보도를 찾지 못했어요.</div>';
      return;
    }
    container.innerHTML =
      '<div class="divide-grid">' +
      matched.map(function(r, i){
        return '<div class="divide-card' + (i % 2 ? ' accent' : '') + '">' +
          '<div class="source-row"><span class="source-badge">' + wcEscape(r.region.slice(0,1)) + '</span>' +
          '<span>' + wcEscape(r.source) + ' <em>(' + wcEscape(r.region) + ')</em></span></div>' +
          '<blockquote>' + wcEscape(r.item.title) + '</blockquote>' +
          '<a class="source-link" href="' + r.item.link + '" target="_blank" rel="noopener">더 알아보기 →</a>' +
        '</div>';
      }).join('') +
      '</div>' +
      '<div class="wc-note">발행 시점에 가져온 결과예요. 시간이 지나면 자동으로 새로고침돼요.</div>';
  }
  function wcRenderSkipped(container, results){
    var total = results.length;
    var covered = results.filter(function(r){ return r.matched; });
    var missed = results.filter(function(r){ return !r.matched; });
    if(missed.length === 0){
      container.innerHTML = '<div class="wc-empty">확인한 ' + total + '곳 모두 이 소식을 다뤘어요.</div>';
      return;
    }
    var dots = results.map(function(r){ return '<span class="dot' + (r.matched ? ' on' : '') + '"></span>'; }).join('');
    container.innerHTML =
      '<div class="skipped-box">' +
        '<div class="coverage-dots">' + dots + '</div>' +
        '<div class="skipped-meta">' + total + '곳 중 ' + covered.length + '곳만 보도했어요</div>' +
        '<ul class="skipped-list">' +
        missed.map(function(r){
          return '<li><div class="skipped-row"><div>' +
            '<div class="skipped-title">' + wcEscape(r.region) + '에서는 이 소식을 다루지 않았어요</div>' +
          '</div></div></li>';
        }).join('') +
        '</ul>' +
      '</div>' +
      '<div class="wc-note">발행 시점에 가져온 결과예요. 시간이 지나면 자동으로 새로고침돼요.</div>';
  }

  function wireWorldCoverage(post, divideEl, skippedEl){
    var topic = post.title || '';
    if(wcKeywords(topic).length === 0) return;
    [divideEl, skippedEl].forEach(function(el){
      if(!el) return;
      var isDivide = el.classList.contains('divide');
      el.addEventListener('toggle', function(){
        if(!el.open || el.dataset.wcLoading) return;
        el.dataset.wcLoading = '1';
        var container = el.querySelector('.divide-detail') || el.querySelector('.skipped-detail');
        container.innerHTML = '<div class="wc-loading">전 세계 언론을 확인하는 중… (0/' + (WC_REGIONS.length + 1) + ')</div>';
        wcFetchAll(topic, function(done, total){
          var loading = container.querySelector('.wc-loading');
          if(loading) loading.textContent = '전 세계 언론을 확인하는 중… (' + done + '/' + total + ')';
        }).then(function(results){
          if(isDivide) wcRenderDivide(container, results); else wcRenderSkipped(container, results);
        });
      });
    });
  }
</script>
