<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magazine (scaffold)</title>
<style>
  @font-face{
    font-family:'Pretendard';
    src:url('vendor/fonts/Pretendard-SemiBold.woff2') format('woff2');
    font-weight:600;
    font-display:swap;
  }
  :root{
    --gold:#ffcf8a;
    --amber:#e8823c;
    --deep:#0d0d0d;
    --cream:#f2f2f2;
    --bg-top:#0d0d0d;
    --bg-mid:#1a1a1a;
    --bg-bottom:#262626;
    --text:#f2f2f2;
    --text-muted:rgba(242,242,242,.6);
    --surface:rgba(255,255,255,.06);
    --surface-border:rgba(255,255,255,.14);
    --header-bg:rgba(10,10,10,.55);
  }
  :root[data-theme="light"]{
    --gold:#c97a2e;
    --amber:#b8571f;
    --deep:#111111;
    --cream:#111111;
    --bg-top:#ffffff;
    --bg-mid:#fafafa;
    --bg-bottom:#ededed;
    --text:#111111;
    --text-muted:rgba(17,17,17,.6);
    --surface:rgba(0,0,0,.05);
    --surface-border:rgba(0,0,0,.12);
    --header-bg:rgba(255,255,255,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 550px at 50% 0%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 70%),
      linear-gradient(180deg,var(--bg-top),var(--bg-mid) 45%,var(--bg-bottom) 100%);
    background-attachment:fixed;
    transition:background .3s ease-out,color .3s ease-out;
  }
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---- nav ---- */
  header{
    position:sticky;top:0;z-index:10;
    background:var(--header-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--surface-border);
    transition:transform .4s cubic-bezier(.32,.72,0,1);
  }
  header.nav-hidden{transform:translateY(-100%);}
  header .wrap{
    display:flex;align-items:center;gap:32px;
    height:64px;
  }
  .logo-lockup{display:flex;align-items:center;gap:8px;}
  .logo-mark{display:block;}
  .logo-name{
    font-size:15px;font-weight:700;
    background:linear-gradient(90deg,var(--gold),var(--amber),var(--gold));
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 4s linear infinite;
  }
  .navlinks{display:flex;gap:22px;font-size:14px;color:var(--text-muted);flex:1;}
  .navlinks a:hover{color:var(--text);}
  .navicons{display:flex;gap:10px;color:var(--text-muted);}
  .navicons .round{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--surface-border);
    cursor:pointer;color:var(--text);
  }
  @keyframes shimmer{to{background-position:-200% center;}}

  /* ---- hero feature grid ---- */
  main{padding:40px 0 80px;}
  .feature-grid{
    display:grid;grid-template-columns:2fr 1fr;gap:28px;
    margin-bottom:64px;
  }
  .feature-side-col{display:flex;flex-direction:column;gap:20px;}
  .thumb{
    display:block;border-radius:14px;aspect-ratio:16/9;
    background:linear-gradient(135deg,#c9822f,#7a3418 60%,#3a1408);
    margin-bottom:18px;
  }
  .feature-side .thumb{aspect-ratio:16/10;}
  .eyebrow{
    font-size:13px;font-weight:700;color:var(--amber);
    letter-spacing:.02em;margin-bottom:8px;
  }
  .feature-main h1{
    font-size:30px;line-height:1.4;font-weight:800;margin-bottom:12px;
    text-shadow:0 0 24px rgba(255,190,120,.35);
  }
  .feature-side h2{
    font-size:19px;line-height:1.5;font-weight:700;margin-bottom:10px;
  }
  .excerpt{font-size:14px;line-height:1.7;color:var(--text-muted);margin-bottom:18px;}
  .btn{
    display:inline-block;padding:10px 20px;border-radius:999px;
    background:var(--text);color:var(--bg-top);font-size:14px;font-weight:700;
  }

  /* ---- content grid ---- */
  .content-grid{
    display:grid;grid-template-columns:280px 1fr;gap:40px;
  }
  .panel-title{font-size:17px;font-weight:800;margin-bottom:4px;}
  .panel-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;}

  .trending{list-style:none;margin-bottom:40px;}
  .trending li{
    display:flex;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--surface-border);
    font-size:14px;
  }
  .trending li:first-child{padding-top:0;}
  .trending a:hover{color:var(--amber);}
  .rank{
    font-weight:800;color:var(--amber);width:16px;flex:none;
    text-shadow:0 0 14px color-mix(in srgb, var(--amber) 65%, transparent);
  }
  .empty-note{font-size:13px;color:var(--text-muted);padding:16px 0;}

  /* ---- soft grouping glow (Toss-style: low-opacity radial fade instead of drop-shadow) ---- */
  .content-grid > div:first-child{position:relative;}
  .content-grid > div:first-child::before{
    content:'';position:absolute;z-index:-1;
    top:-50px;left:-70px;width:360px;height:360px;
    background:radial-gradient(circle, color-mix(in srgb, var(--amber) 16%, transparent), transparent 70%);
    pointer-events:none;
  }

  /* .quiz와 .visionary-compact는 같은 사이드박스 자리를 방문마다 랜덤으로 나눠 쓴다
     (JS의 renderSideSwap 참고) -- 그래서 바깥 박스 스타일을 공유한다. */
  .quiz,.visionary-compact{
    background:var(--surface);border:1px solid var(--surface-border);
    border-radius:14px;padding:20px;
  }
  .quiz p{font-size:14px;line-height:1.6;margin-bottom:14px;}
  .quiz .answers{display:flex;gap:10px;}
  .quiz button{
    flex:1;padding:10px;border:1px solid var(--surface-border);border-radius:10px;
    background:transparent;color:var(--text);font-size:14px;cursor:pointer;
  }
  .quiz button:hover{background:var(--surface-border);}

  .visionary-compact .panel-title{margin-bottom:4px;}
  .visionary-compact .panel-sub{margin-bottom:14px;}
  .vc-list{list-style:none;}
  .vc-row{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--surface-border);font-size:13px;}
  .vc-row:last-child{border-bottom:none;}
  .vc-statement{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vc-statement b{font-weight:700;}
  .vc-rate{font-weight:800;flex:none;font-size:12px;}
  .vc-rate.pos{color:#7dd88a;}
  .vc-rate.neg{color:var(--amber);}
  .vc-pending{flex:none;font-size:11px;color:var(--text-muted);}
  .vc-note{font-size:11px;line-height:1.6;color:var(--text-muted);margin-top:14px;}
  .vc-note a{color:var(--amber);}
  .vc-more{display:block;margin-top:12px;font-size:12px;font-weight:700;color:var(--amber);text-align:right;}

  .card-list{list-style:none;}
  .card-row{
    display:flex;gap:20px;align-items:center;justify-content:space-between;
    padding:20px 0;border-bottom:1px solid var(--surface-border);
  }
  .card-row:first-child{padding-top:0;}
  .card-row h3{font-size:16px;font-weight:700;margin-bottom:6px;}
  .card-row .excerpt{margin-bottom:6px;}
  .card-row .meta{font-size:12px;color:var(--text-muted);}
  .card-row .thumb{
    width:110px;height:110px;flex:none;margin-bottom:0;aspect-ratio:auto;
  }

  /* ---- feed (masonry) ---- */
  .feed{margin-top:64px;}
  .feed-grid{column-count:2;column-gap:16px;}
  .feed-card{
    position:relative;display:block;overflow:hidden;border-radius:16px;
    margin-bottom:16px;break-inside:avoid;
  }
  .feed-card::before{
    content:'';position:absolute;inset:0;
    background:var(--fc-grad);
  }
  .feed-card::after{
    content:'';position:absolute;inset:auto 0 0 0;height:60%;
    background:linear-gradient(180deg,transparent,rgba(10,4,2,.85));
  }
  .feed-card-text{position:absolute;left:16px;right:16px;bottom:16px;z-index:1;}
  .feed-byline{font-size:12px;color:rgba(245,233,218,.75);margin-bottom:6px;}
  .feed-card h3{font-size:16px;font-weight:700;line-height:1.35;color:#fff;}
  .feed-card:nth-child(6n+1){height:260px;--fc-grad:linear-gradient(160deg,#ffcf8a,#e8823c 60%,#7a3418);}
  .feed-card:nth-child(6n+2){height:320px;--fc-grad:linear-gradient(160deg,#5a2f8a,#2a1a4a);}
  .feed-card:nth-child(6n+3){height:300px;--fc-grad:linear-gradient(160deg,#2f6b6b,#123030);}
  .feed-card:nth-child(6n+4){height:220px;--fc-grad:linear-gradient(160deg,#c9436b,#4a1030);}
  .feed-card:nth-child(6n+5){height:280px;--fc-grad:linear-gradient(160deg,#e8823c,#3a1408);}
  .feed-card:nth-child(6n+0){height:240px;--fc-grad:linear-gradient(160deg,#3a6bc9,#0f1a3a);}
  @media (min-width:900px){ .feed-grid{column-count:3;} }

  /* ---- transient reveal flash (Toss-style: brief gradient brightness pulse on reveal) ---- */
  @keyframes fc-flash{0%{filter:brightness(1.6) saturate(1.2);}100%{filter:brightness(1);}}
  .feed-card.in-view{animation:fc-flash .9s ease-out;}

  /* ---- scroll reveal ---- */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease-out,transform .6s ease-out;}
  .reveal.in-view{opacity:1;transform:none;}

  @media (max-width:760px){
    .feature-grid{grid-template-columns:1fr;}
    .content-grid{grid-template-columns:1fr;}
    .navlinks{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo-lockup" href="index.html">
      <svg class="logo-mark" viewBox="0 0 100 34" width="50" height="17" aria-label="VC">
        <g transform="scale(1.47,1)">
          <text y="27" font-family="Pretendard, sans-serif" font-weight="600" font-size="34" letter-spacing="-0.015em" fill="var(--text)">VC</text>
        </g>
      </svg>
    </a>
    <nav class="navlinks">
      <a href="#">라이프스타일</a>
      <a href="#">머니</a>
      <a href="#">커리어</a>
      <a href="#">칼럼</a>
      <a href="visionary-feed.html">비저너리</a>
      <a href="today.html">오늘의 예측</a>
    </nav>
    <div class="navicons">
      <div class="round">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="round" id="theme-toggle" aria-label="테마 전환">
        <svg id="theme-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </div>
      <div class="round">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="feature-grid" id="hero-grid">
    <div class="feature-main reveal empty-note">아직 등록된 글이 없어요.</div>
  </section>

  <section class="content-grid">
    <div>
      <div class="panel-title reveal">지금 많이 보는 콘텐츠</div>
      <div class="panel-sub reveal">사람들이 주목하는 이야기</div>
      <ol class="trending reveal" id="trending-list">
        <li class="empty-note">아직 조회 기록이 없어요.</li>
      </ol>
    </div>

    <div>
      <div class="panel-title reveal">관심 있을 만한 콘텐츠</div>
      <div class="panel-sub reveal">꼼꼼하게 함께 살펴보세요</div>
      <ul class="card-list" id="card-list">
        <li class="empty-note">아직 등록된 글이 없어요.</li>
      </ul>
    </div>
  </section>

  <section class="feed">
    <div class="panel-title reveal">최신 콘텐츠</div>
    <div class="panel-sub reveal">방금 올라온 이야기</div>
    <div class="feed-grid" id="feed-grid">
      <div class="empty-note">아직 등록된 글이 없어요.</div>
    </div>
  </section>

</main>

<script src="vendor/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
  var SUN = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4" y1="12" x2="2" y2="12"/><line x1="22" y1="12" x2="20" y2="12"/><line x1="19.07" y1="4.93" x2="17.66" y2="6.34"/><line x1="6.34" y1="17.66" x2="4.93" y2="19.07"/><line x1="19.07" y1="19.07" x2="17.66" y2="17.66"/><line x1="6.34" y1="6.34" x2="4.93" y2="4.93"/>';
  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var themeIcon = document.getElementById('theme-icon');
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    localStorage.setItem('theme', t);
    themeIcon.innerHTML = t === 'light' ? MOON : SUN;
  }
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('theme-toggle').addEventListener('click', function(){
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });
  (function(){
    var headerEl = document.querySelector('header');
    var lastY = window.scrollY;
    var ticking = false;
    window.addEventListener('scroll', function(){
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        var y = window.scrollY;
        headerEl.classList.toggle('nav-hidden', y > lastY && y > 80);
        lastY = y;
        ticking = false;
      });
    }, { passive: true });
  })();

  function checkReveal(){
    document.querySelectorAll('.reveal').forEach(function(el){
      if(el.classList.contains('in-view')) return;
      if(el.getBoundingClientRect().top < window.innerHeight*0.9){ el.classList.add('in-view'); }
    });
  }
  checkReveal();
  window.addEventListener('scroll', checkReveal, {passive:true});

  /* ---- wire real content from supabase ---- */
  function excerptOf(body, len){
    var plain = (body || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[#*_>`~-]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    return plain.length > len ? plain.slice(0, len) + '…' : plain;
  }
  function readMinutes(body){
    return Math.max(1, Math.round((body || '').length / 500));
  }
  function esc(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  db.from('posts').select('id,title,body,views,created_at,author_email').order('created_at', {ascending:false}).limit(20).then(function(res){
    var posts = (res.data || []);
    renderHero(posts.slice(0, 2));
    renderTrending(posts.slice().sort(function(a,b){ return (b.views||0) - (a.views||0); }).slice(0, 5));
    renderCards(posts.slice(2, 5));
    renderFeed(posts.slice(0, 6));
    checkReveal();
  });

  // 오늘의 퀴즈 자리는 방문마다 랜덤으로 퀴즈 또는 비저너리 요약과 자리를 바꾼다.
  // 승률 계산식 자체는 Edge Function으로 옮겨져 있어서(view-source 노출 방지),
  // 여기선 완성된 결과를 받아 그리기만 한다.
  var QUIZ_HTML =
    '<div class="panel-title">오늘의 퀴즈</div>' +
    '<div class="panel-sub">하루에 하나씩 풀 수 있어요.</div>' +
    '<p>Q. 여기에 퀴즈 질문이 들어갑니다.</p>' +
    '<div class="answers"><button>그렇다</button><button>아니다</button></div>';

  function renderSideSwap(){
    var el = document.getElementById('side-swap');
    if(Math.random() < 0.5){
      el.className = 'reveal quiz';
      el.innerHTML = QUIZ_HTML;
      return;
    }
    el.className = 'reveal visionary-compact';
    el.innerHTML =
      '<div class="panel-title">비저너리</div>' +
      '<div class="panel-sub">경제 유튜버 발언 · 결과</div>' +
      '<ul class="vc-list" id="vc-list"><li class="empty-note">아직 수집된 발언이 없어요.</li></ul>' +
      '<a class="vc-more" href="visionary-feed.html">더 보기 →</a>';

    fetch(SUPABASE_URL + '/functions/v1/super-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ action: 'visionary-feed', limit: 3 })
    }).then(function(r){ return r.json(); }).then(function(result){
      renderVisionaryCompact(result.rows || []);
      checkReveal();
    }).catch(function(){});
  }

  // 판정 전(pending)인 발언은 수익률을 아예 안 보여준다 -- 0%나 빈칸으로 두면
  // "이미 결과 나온 수익률이 0%다"로 오해하기 쉬워서, "판정 전"이라고 확실히 표시한다.
  function renderVisionaryCompact(rows){
    if(rows.length === 0) return;
    var list = document.getElementById('vc-list');
    if(!list) return; // 그 사이 반대편(퀴즈)으로 다시 그려졌을 수 있음 -- 조용히 건너뜀
    list.innerHTML = rows.slice(0, 3).map(function(r){
      var rateHtml = r.excessReturn == null
        ? '<span class="vc-pending">판정 전</span>'
        : '<span class="vc-rate ' + (r.excessReturn >= 0 ? 'pos' : 'neg') + '">' +
            (r.excessReturn >= 0 ? '+' : '') + r.excessReturn.toFixed(1) + '%</span>';
      return '<li class="vc-row">' +
        '<span class="vc-statement"><b>' + esc(r.name) + '</b> · ' + esc(r.statement) + '</span>' +
        rateHtml +
      '</li>';
    }).join('');
  }

  function renderHero(posts){
    var grid = document.getElementById('hero-grid');
    if(posts.length === 0) return;
    var main = posts[0], side = posts[1];
    var html = '<a class="feature-main reveal" href="post.html?id=' + main.id + '">' +
      '<div class="thumb"></div>' +
      '<div class="eyebrow">이 주의 콘텐츠</div>' +
      '<h1>' + esc(main.title) + '</h1>' +
      '<p class="excerpt">' + esc(excerptOf(main.body, 90)) + '</p>' +
      '<span class="btn">이어서 보기</span>' +
    '</a>';
    // 오른쪽 칸: 최근 글 카드 + 퀴즈/비저너리 랜덤 자리를 세로로 묶는다 -- 카드가 왼쪽보다
    // 짧아서 grid stretch로 생기던 빈 공간을 여기 채운다(전엔 그 빈 자리가 그냥 낭비였음).
    html += '<div class="feature-side-col">';
    if(side){
      html += '<a class="feature-side reveal" href="post.html?id=' + side.id + '">' +
        '<div class="thumb"></div>' +
        '<div class="eyebrow">최근 글</div>' +
        '<h2>' + esc(side.title) + '</h2>' +
        '<p class="excerpt">' + esc(excerptOf(side.body, 60)) + '</p>' +
      '</a>';
    }
    html += '<div class="reveal" id="side-swap"></div></div>';
    grid.innerHTML = html;
    renderSideSwap();
  }
  function renderTrending(posts){
    var list = document.getElementById('trending-list');
    if(posts.length === 0) return;
    list.innerHTML = posts.map(function(p, i){
      return '<li><span class="rank">' + (i+1) + '</span><a href="post.html?id=' + p.id + '">' + esc(p.title) + '</a></li>';
    }).join('');
  }
  function renderCards(posts){
    var list = document.getElementById('card-list');
    if(posts.length === 0) return;
    list.innerHTML = posts.map(function(p){
      return '<li class="card-row reveal">' +
        '<div>' +
          '<h3><a href="post.html?id=' + p.id + '">' + esc(p.title) + '</a></h3>' +
          '<p class="excerpt">' + esc(excerptOf(p.body, 50)) + '</p>' +
          '<div class="meta">읽기 ' + readMinutes(p.body) + '분</div>' +
        '</div>' +
        '<a class="thumb" href="post.html?id=' + p.id + '"></a>' +
      '</li>';
    }).join('');
  }
  function renderFeed(posts){
    var grid = document.getElementById('feed-grid');
    if(posts.length === 0) return;
    grid.innerHTML = posts.map(function(p){
      var date = new Date(p.created_at).toLocaleDateString('ko-KR', { month:'long', day:'numeric' });
      return '<a class="feed-card reveal" href="post.html?id=' + p.id + '">' +
        '<div class="feed-card-text">' +
          '<div class="feed-byline">' + esc(p.author_email || '익명') + ' · ' + date + '</div>' +
          '<h3>' + esc(p.title) + '</h3>' +
        '</div>' +
      '</a>';
    }).join('');
  }
</script>
</body>
</html>
